  <script>
    (() => {
      const draggableItems = [...document.querySelectorAll('.draggable-item')];
      const threshold = 4;
      let startX, startY, originX, originY, pointerId;
      let activeLink = null;
      let pending = false, dragging = false, moved = false, leaving = false;

      const startDrag = (event, target = event.currentTarget) => {
        if (pending) return;
        pending = true;
        dragging = false;
        moved = false;
        pointerId = event.pointerId;
        activeLink = target;
        startX = event.clientX;
        startY = event.clientY;
        const bounds = activeLink.getBoundingClientRect();
        originX = bounds.left;
        originY = bounds.top;
      };

      draggableItems.forEach(link => link.addEventListener('pointerdown', startDrag));

      const moveDrag = event => {
        if (!pending || event.pointerId !== pointerId) return;
        const deltaX = event.clientX - startX;
        const deltaY = event.clientY - startY;

        if (!dragging) {
          if (Math.abs(deltaX) + Math.abs(deltaY) <= threshold) return;
          dragging = true;
          moved = true;
          activeLink.dataset.userMoved = 'true';
          activeLink.style.transform = 'none';
          activeLink.style.left = `${VisualIdentity.snap(originX)}px`;
          activeLink.style.top = `${VisualIdentity.snap(originY)}px`;
          activeLink.style.bottom = 'auto';
          activeLink.classList.add('dragging');
        }

        activeLink.style.left = `${VisualIdentity.snap(originX) + VisualIdentity.snapDelta(deltaX)}px`;
        activeLink.style.top = `${VisualIdentity.snap(originY) + VisualIdentity.snapDelta(deltaY)}px`;
      };

      const finishDrag = event => {
        if (event && event.pointerId !== pointerId) return;
        pending = false;
        dragging = false;
        pointerId = null;
        activeLink?.classList.remove('dragging');
        activeLink = null;
      };

      addEventListener('pointermove', moveDrag);
      addEventListener('pointerup', finishDrag);
      addEventListener('pointercancel', finishDrag);
      addEventListener('blur', () => finishDrag());

      const VisualIdentity = {
        pixelSize: Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--identity-pixel-size')) || 8,
        pixelBlockSizes: [1, 2, 4, 8],
        pixelFrameDelay: 70
      };
      window.VisualIdentity = VisualIdentity;

      VisualIdentity.snap = value => Math.round(value / VisualIdentity.pixelSize) * VisualIdentity.pixelSize;
      VisualIdentity.snapDelta = value => Math.trunc(value / VisualIdentity.pixelSize) * VisualIdentity.pixelSize;

      // Window stacking: the active window rises above the others. Windows
      // start at the z-index 30 tier; each raise takes the next slot (still
      // far below the transition overlay at 9999). Any pointerdown inside a
      // window counts as activating it; openers call raise() explicitly.
      let windowZ = 30;
      VisualIdentity.raiseWindow = windowElement => {
        windowElement.style.zIndex = ++windowZ;
      };

      // Window placement: centred, but stepped down-right from the windows
      // already on the desk — the way a classic desktop cascades them — so a
      // newly opened window never lands exactly on top of the last. A window
      // keeps the slot it was given the first time it opened, so reopening or
      // resizing puts it back instead of drifting further down the stack; one
      // the reader has dragged is left exactly where they put it.
      VisualIdentity.windowStep = VisualIdentity.pixelSize * 4;   // 32px — leaves enough of the 48px title bar beneath to grab

      const windowSlots = new WeakMap();
      let nextWindowSlot = 0;

      // Phone mode. Overlapping draggable windows are a big-screen idea; there
      // is no good version of them at 375px. So below this width the desk stops
      // pretending to be a desk and becomes what System 8 would be on a phone:
      // a home screen of icons, and one app filling the screen at a time.
      // Kept in one place so CSS (@media 640px) and JS can't drift apart.
      VisualIdentity.phoneQuery = matchMedia('(max-width: 640px)');
      VisualIdentity.isPhone = () => VisualIdentity.phoneQuery.matches;

      VisualIdentity.placeWindow = windowElement => {
        if (windowElement.hidden) return;
        // On a phone the app fills the screen, so there is nowhere to place it
        // and nothing to cascade past. Clear the desk's inline coords and let
        // the stylesheet own the box — including for a window the reader
        // dragged on a wider screen before rotating.
        if (VisualIdentity.isPhone()) {
          windowElement.style.left = '';
          windowElement.style.top = '';
          return;
        }
        if (windowElement.dataset.userMoved) return;
        if (!windowSlots.has(windowElement)) windowSlots.set(windowElement, nextWindowSlot++);
        const slot = windowSlots.get(windowElement);
        const step = VisualIdentity.windowStep;
        const rect = windowElement.getBoundingClientRect();
        const left = Math.max(16, (innerWidth - rect.width) / 2);
        const top = Math.max(16, (innerHeight - rect.height) / 2);
        // Each axis wraps on its own once the stack would run off the desk.
        // They rarely run out at the same count, so the slots stay distinct
        // even when one direction fills up first — and nothing marches off.
        const stepsX = Math.max(1, Math.floor((innerWidth - 16 - rect.width - left) / step) + 1);
        const stepsY = Math.max(1, Math.floor((innerHeight - 16 - rect.height - top) / step) + 1);
        windowElement.style.left = `${VisualIdentity.snap(left + (slot % stepsX) * step)}px`;
        windowElement.style.top = `${VisualIdentity.snap(top + (slot % stepsY) * step)}px`;
      };

      // Icon stacking: the touched icon rises above its siblings, but the
      // whole tier must stay below the links (20) and windows (30+) — so
      // instead of counting upward, the tier is renormalized to 2..N on
      // every raise (the active icon takes the top slot).
      VisualIdentity.raiseIcon = iconElement => {
        const rest = [...document.querySelectorAll('.pixel-icon')]
          .filter(el => el !== iconElement)
          .sort((a, b) => (+a.style.zIndex || 2) - (+b.style.zIndex || 2));
        rest.concat(iconElement).forEach((el, i) => {
          el.style.zIndex = 2 + i;
        });
      };

      document.addEventListener('pointerdown', event => {
        const win = event.target.closest('.mac-window');
        if (win && !win.hidden) {
          VisualIdentity.raiseWindow(win);
          return;
        }
        const icon = event.target.closest('.pixel-icon');
        if (icon) VisualIdentity.raiseIcon(icon);
      }, true);

      // Snap every pixel-art element onto the low-resolution grid. CSS centering
      // and bottom-anchoring land on arbitrary pixels, so this converts them to
      // grid-aligned left/top. Items the user dragged away keep their spot.
      VisualIdentity.alignToGrid = () => {
        const gridCeil = value => Math.ceil(value / VisualIdentity.pixelSize) * VisualIdentity.pixelSize;

        // Icons flow as centered rows, wrapping when the viewport is too
        // narrow for one row (rows fill greedily, whole block stays
        // vertically centered).
        const icons = [...document.querySelectorAll('.pixel-icon')];
        if (icons.length) {
          const iconGap = VisualIdentity.pixelSize * 6;
          const maxRowWidth = innerWidth - 64;
          const rows = [[]];
          let runningWidth = 0;
          icons.forEach(icon => {
            const width = gridCeil(icon.offsetWidth);
            const row = rows[rows.length - 1];
            const nextWidth = runningWidth + (row.length ? iconGap : 0) + width;
            if (row.length && nextWidth > maxRowWidth) {
              rows.push([icon]);
              runningWidth = width;
            } else {
              row.push(icon);
              runningWidth = nextWidth;
            }
          });
          const iconHeight = icons[0].offsetHeight;
          const blockHeight = rows.length * iconHeight + (rows.length - 1) * iconGap;
          let iconY = VisualIdentity.snap((innerHeight - blockHeight) / 2);
          rows.forEach(row => {
            const rowWidth = row.reduce((sum, icon) => sum + gridCeil(icon.offsetWidth), 0)
              + iconGap * (row.length - 1);
            let iconX = VisualIdentity.snap((innerWidth - rowWidth) / 2);
            row.forEach(icon => {
              if (!icon.dataset.userMoved) {
                icon.style.transform = 'none';
                icon.style.left = `${iconX}px`;
                icon.style.top = `${iconY}px`;
              }
              iconX += gridCeil(icon.offsetWidth) + iconGap;
            });
            iconY += iconHeight + iconGap;
          });
        }

        // The light switch is wall-mounted top-right; right-anchoring can't
        // guarantee a grid-multiple left, so it is placed from the left.
        const lightSwitch = document.querySelector('.light-switch');
        if (lightSwitch) {
          lightSwitch.style.left =
            `${VisualIdentity.snap(innerWidth - lightSwitch.offsetWidth - 32)}px`;
        }
      };

      addEventListener('resize', VisualIdentity.alignToGrid);
      VisualIdentity.alignToGrid();
      document.fonts?.ready.then(VisualIdentity.alignToGrid);

      // Theme control, shared by the wall light switch and the Control
      // Panel: setTheme() applies [data-theme], stores the choice, keeps
      // the switch's aria state honest, and announces the change so any
      // other control (the panel's checkbox) can follow. The swap is a
      // single hard palette swap — no transition. With no stored choice,
      // the page follows the system preference live.
      const lightSwitch = document.querySelector('.light-switch');
      const syncSwitch = () => {
        lightSwitch.setAttribute('aria-pressed',
          String(document.documentElement.dataset.theme === 'dark'));
      };
      VisualIdentity.setTheme = (dark, store = true) => {
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
        } else {
          delete document.documentElement.dataset.theme;
        }
        if (store) localStorage.setItem('identity-theme', dark ? 'dark' : 'light');
        syncSwitch();
        document.dispatchEvent(new CustomEvent('identity-theme-change', { detail: { dark } }));
      };

      // Accent theme (indigo default, seafoam alternate): swaps the primary +
      // tint ramp via [data-accent], persists, and announces the change so
      // the Control Panel's picker can follow. 'indigo' clears the attribute.
      const ACCENTS = ['seafoam'];
      VisualIdentity.setAccent = (accent, store = true) => {
        accent = ACCENTS.includes(accent) ? accent : 'indigo';
        if (accent === 'indigo') {
          delete document.documentElement.dataset.accent;
        } else {
          document.documentElement.dataset.accent = accent;
        }
        if (store) localStorage.setItem('identity-accent', accent);
        document.dispatchEvent(new CustomEvent('identity-accent-change', { detail: { accent } }));
      };

      syncSwitch();
      lightSwitch.addEventListener('click', () =>
        VisualIdentity.setTheme(document.documentElement.dataset.theme !== 'dark'));
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        if (localStorage.getItem('identity-theme')) return;
        VisualIdentity.setTheme(event.matches, false);
      });

      // Publications come from publications.bib.js as plain BibTeX.
      // Minimal parser: entry types, keys, and brace/quote-delimited fields.
      const parseBibTeX = source => {
        const entries = [];
        let cursor = 0;
        while ((cursor = source.indexOf('@', cursor)) !== -1) {
          const open = source.indexOf('{', cursor);
          if (open === -1) break;
          const type = source.slice(cursor + 1, open).trim().toLowerCase();
          let end = open + 1;
          for (let depth = 1; end < source.length && depth > 0; end += 1) {
            if (source[end] === '{') depth += 1;
            else if (source[end] === '}') depth -= 1;
          }
          const body = source.slice(open + 1, end - 1);
          cursor = end;
          if (type === 'comment' || type === 'string' || type === 'preamble') continue;

          const firstComma = body.indexOf(',');
          const entry = { type, key: body.slice(0, firstComma).trim(), fields: {} };
          let rest = body.slice(firstComma + 1);
          let i = 0;
          while (i < rest.length) {
            while (i < rest.length && /[\s,]/.test(rest[i])) i += 1;
            const eq = rest.indexOf('=', i);
            if (eq === -1) break;
            const name = rest.slice(i, eq).trim().toLowerCase();
            i = eq + 1;
            while (i < rest.length && /\s/.test(rest[i])) i += 1;
            let value = '';
            if (rest[i] === '{') {
              const start = ++i;
              for (let depth = 1; i < rest.length && depth > 0; i += 1) {
                if (rest[i] === '{') depth += 1;
                else if (rest[i] === '}') depth -= 1;
              }
              value = rest.slice(start, i - 1);
            } else if (rest[i] === '"') {
              const start = ++i;
              while (i < rest.length && rest[i] !== '"') i += 1;
              value = rest.slice(start, i);
              i += 1;
            } else {
              const start = i;
              while (i < rest.length && !/[,\s]/.test(rest[i])) i += 1;
              value = rest.slice(start, i);
            }
            if (name) entry.fields[name] = value.replace(/\s+/g, ' ').trim();
          }
          entries.push(entry);
        }
        return entries;
      };

      // "Last, First" -> "F Last"; names without a comma (CJK) stay as written.
      const formatAuthor = name => {
        const clean = name.replace(/[{}]/g, '').trim();
        const comma = clean.indexOf(',');
        if (comma === -1) return clean;
        const last = clean.slice(0, comma).trim();
        const initials = clean.slice(comma + 1).trim()
          .split(/[\s.]+/).filter(Boolean).map(part => part[0]).join(' ');
        return `${initials} ${last}`;
      };

      const isSelfAuthor = name => (window.PUBLICATIONS_SELF ?? []).some(self =>
        formatAuthor(name) === formatAuthor(self));

      const PUB_SECTIONS = [
        { id: 'journal', title: 'Journal Articles' },
        { id: 'international', title: 'International Conferences' },
        { id: 'domestic', title: 'Domestic Conferences & Workshops' },
        { id: 'preprint', title: 'Preprints' },
        { id: 'other', title: 'Other' }
      ];

      const PUB_TYPE_SECTIONS = {
        article: 'journal',
        inproceedings: 'international',
        conference: 'international',
        techreport: 'domestic',
        unpublished: 'preprint'
      };

      const sectionFor = entry =>
        entry.fields.category || PUB_TYPE_SECTIONS[entry.type] || 'other';

      const renderPublications = () => {
        const content = document.querySelector('.mac-window .mac-content');
        if (!content || typeof window.PUBLICATIONS_BIB !== 'string') return;
        const entries = parseBibTeX(window.PUBLICATIONS_BIB);

        PUB_SECTIONS.forEach(section => {
          const pubs = entries
            .filter(entry => sectionFor(entry) === section.id)
            .sort((a, b) => (Number.parseInt(b.fields.year, 10) || 0) - (Number.parseInt(a.fields.year, 10) || 0));
          if (!pubs.length) return;

          const wrap = document.createElement('section');
          wrap.className = 'pub-section';
          wrap.dataset.section = section.id;
          const heading = document.createElement('h3');
          heading.className = 'pub-section-title';
          heading.textContent = section.title;
          wrap.appendChild(heading);

          const list = document.createElement('ol');
          list.className = 'pub-list';
          pubs.forEach(pub => {
            const item = document.createElement('li');
            item.className = 'pub';

            const title = document.createElement('h4');
            title.className = 'pub-title';
            const displayTitle = (pub.fields.title || pub.key).replace(/[{}]/g, '');
            if (pub.fields.url) {
              const link = document.createElement('a');
              link.href = pub.fields.url;
              link.target = '_blank';
              link.rel = 'noopener';
              link.textContent = displayTitle;
              title.appendChild(link);
            } else {
              title.textContent = displayTitle;
            }

            const meta = document.createElement('p');
            meta.className = 'pub-meta';
            const venue = pub.fields.shortvenue || pub.fields.booktitle || pub.fields.journal || '';
            const authors = (pub.fields.author || '').split(/\s+and\s+/).filter(Boolean);
            authors.forEach((name, index) => {
              const display = formatAuthor(name);
              if (isSelfAuthor(name)) {
                const self = document.createElement('span');
                self.className = 'pub-self';
                self.textContent = display;
                meta.appendChild(self);
              } else {
                meta.append(display);
              }
              if (index < authors.length - 1) meta.append(', ');
            });
            if (authors.length && venue) meta.append(` · ${venue}`);
            else if (venue) meta.append(venue);
            if (authors.length || venue) meta.append(' · ');
            const year = document.createElement('span');
            year.className = 'pub-year';
            year.textContent = pub.fields.year || '';
            meta.appendChild(year);

            // Downloadable materials, if the entry declares any. Rather than a
            // plain download, each opens Messages and Jiali "sends" the file.
            const mats = [
              { field: 'slides', kind: 'slides' },
              { field: 'paper', kind: 'paper' },
              { field: 'poster', kind: 'poster' },
            ].filter(m => pub.fields[m.field]);
            if (mats.length) {
              const actions = document.createElement('div');
              actions.className = 'pub-actions';
              const venue = [pub.fields.shortvenue || pub.fields.booktitle, pub.fields.year]
                .filter(Boolean).join(' ').replace(/[{}]/g, '');
              const base = (pub.fields.shortvenue || 'materials').replace(/[{}]/g, '').replace(/\s+/g, '-');
              mats.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'pub-material';
                btn.type = 'button';
                btn.textContent = m.kind;
                const filename = `${base}${pub.fields.year ? '-' + pub.fields.year : ''}-${m.kind}.pdf`;
                btn.addEventListener('click', () => {
                  window.ChatApp?.share?.({ url: pub.fields[m.field], venue, kind: m.kind, filename });
                });
                actions.appendChild(btn);
              });
              item.append(title, meta, actions);
            } else {
              item.append(title, meta);
            }
            list.appendChild(item);
          });
          wrap.appendChild(list);
          content.appendChild(wrap);
        });
      };
      renderPublications();

      // Publications window: opens from the doc icon, closes from the
      // Mac-style close box (or Escape), drags by its title bar.
      const pubsWindow = document.querySelector('.mac-window');
      const docIcon = document.querySelector('.documentation-icon');

      const placeWindow = () => VisualIdentity.placeWindow(pubsWindow);

      // Restart the slap-on animation (remove + reflow + re-add). A peeled
      // sticker is replaced by a fresh one.
      const slapSticker = (delayMs = 220) => {
        const sticker = pubsWindow.querySelector('.sr-sticker');
        sticker.classList.remove('slapped', 'peeled', 'peeling');
        sticker.style.transform = '';
        sticker.style.setProperty('--sr-slap-delay', `${delayMs}ms`);
        void sticker.offsetWidth;
        sticker.classList.add('slapped');
      };

      const openPubs = () => {
        pubsWindow.hidden = false;
        VisualIdentity.raiseWindow(pubsWindow);
        placeWindow();
        pubsWindow.focus({ preventScroll: true });
        // A long beat on open: the nudge surfaces after you've settled in.
        slapSticker(10000);
      };

      const closePubs = () => {
        pubsWindow.hidden = true;
        docIcon.focus({ preventScroll: true });
      };

      docIcon.addEventListener('click', () => {
        if (moved) return;
        if (pubsWindow.hidden) {
          openPubs();
        } else {
          closePubs();
        }
      });

      pubsWindow.querySelector('.mac-close').addEventListener('click', closePubs);

      const srSticker = pubsWindow.querySelector('.sr-sticker');

      // Peel-off drag (pixel mode only — the glass-mode pop-up is screen
      // content, not a physical sticker). A small tug re-sticks; pulling
      // past the threshold tears the sticker off until a fresh one is
      // slapped on at the next window open.
      const PEEL_THRESHOLD = 80;
      let peelPointer = null;
      let peelStartX = 0;
      let peelStartY = 0;
      let peelMoved = false;

      srSticker.addEventListener('pointerdown', event => {
        if (pubsWindow.classList.contains('super-res')) return;
        peelPointer = event.pointerId;
        peelStartX = event.clientX;
        peelStartY = event.clientY;
        peelMoved = false;
        srSticker.setPointerCapture(event.pointerId);
      });

      srSticker.addEventListener('pointermove', event => {
        if (event.pointerId !== peelPointer) return;
        const deltaX = event.clientX - peelStartX;
        const deltaY = event.clientY - peelStartY;
        if (!peelMoved && Math.abs(deltaX) + Math.abs(deltaY) <= threshold) return;
        peelMoved = true;
        srSticker.classList.add('peeling');
        const tug = Math.min(1, Math.hypot(deltaX, deltaY) / PEEL_THRESHOLD);
        srSticker.style.transform =
          `translate(${deltaX}px, ${deltaY}px) rotate(${-12 + deltaX * 0.06}deg) scale(${1 + tug * 0.05})`;
      });

      const endPeel = event => {
        if (event.pointerId !== peelPointer) return;
        peelPointer = null;
        if (!peelMoved) return;
        const deltaX = event.clientX - peelStartX;
        const deltaY = event.clientY - peelStartY;
        srSticker.classList.remove('peeling');
        if (Math.hypot(deltaX, deltaY) >= PEEL_THRESHOLD) {
          srSticker.style.setProperty('--peel-x', `${deltaX * 1.4}px`);
          srSticker.style.setProperty('--peel-y', `${deltaY * 1.4 + 60}px`);
          // Drop the slap class — its animation shorthand would override
          // the peel-away (equal specificity, later in the sheet).
          srSticker.classList.remove('slapped');
          srSticker.classList.add('peeled');
        } else {
          srSticker.style.transform = '';
        }
      };
      srSticker.addEventListener('pointerup', endPeel);
      srSticker.addEventListener('pointercancel', endPeel);

      srSticker.addEventListener('click', () => {
        if (peelMoved) {
          peelMoved = false;
          return;
        }
        const superRes = pubsWindow.classList.toggle('super-res');
        srSticker.setAttribute('aria-pressed', String(superRes));
        slapSticker();
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !pubsWindow.hidden) closePubs();
      });

      pubsWindow.querySelector('.mac-titlebar').addEventListener('pointerdown', event => {
        if (event.target.closest('.mac-close')) return;
        startDrag(event, pubsWindow);
      });

      addEventListener('resize', placeWindow);

      VisualIdentity.drawPageSnapshot = canvas => {
        const ctx = canvas.getContext('2d');
        // Chrome colors come from the live tokens so the snapshot matches
        // whichever theme is active.
        const rootStyle = getComputedStyle(document.documentElement);
        const token = name => rootStyle.getPropertyValue(name).trim();
        const pageBackground = getComputedStyle(document.body).backgroundColor;
        ctx.fillStyle = pageBackground === 'rgba(0, 0, 0, 0)'
          ? token('--identity-paper') : pageBackground;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        document.querySelectorAll('.pixel-icon .doc-px, .light-switch .doc-px').forEach(px => {
          const rect = px.getBoundingClientRect();
          ctx.fillStyle = getComputedStyle(px).backgroundColor;
          ctx.fillRect(rect.left, rect.top, rect.width, rect.height);
        });

        const drawCenteredText = element => {
          const rect = element.getBoundingClientRect();
          const style = getComputedStyle(element);
          ctx.fillStyle = style.color;
          ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'center';
          ctx.fillText(element.textContent, rect.left + rect.width / 2, rect.top + rect.height / 2);
          ctx.textAlign = 'left';
        };

        document.querySelectorAll('.doc-label').forEach(drawCenteredText);

        document.querySelectorAll('.identity-color').forEach(link => {
          const rect = link.getBoundingClientRect();
          const style = getComputedStyle(link);
          ctx.fillStyle = style.color;
          ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
          ctx.textBaseline = 'middle';
          ctx.fillText(link.textContent, rect.left, rect.top + rect.height / 2);
        });

        // Publications window chrome (body content is left as blank paper —
        // the transition is too fast for it to read anyway).
        const macWindow = document.querySelector('.mac-window');
        if (macWindow && !macWindow.hidden) {
          const rect = macWindow.getBoundingClientRect();
          ctx.fillStyle = token('--identity-tint-shadow');
          ctx.fillRect(rect.left + 8, rect.top + 8, rect.width, rect.height);
          ctx.fillStyle = token('--identity-normal');
          ctx.fillRect(rect.left, rect.top, rect.width, rect.height);
          ctx.fillStyle = token('--identity-paper');
          ctx.fillRect(rect.left + 4, rect.top + 4, rect.width - 8, rect.height - 8);
          ctx.fillStyle = token('--identity-normal');
          for (let stripe = 0; stripe < 3; stripe += 1) {
            ctx.fillRect(rect.left + 4, rect.top + 12 + stripe * 12, rect.width - 8, 4);
          }
          ctx.fillRect(rect.left + 4, rect.top + 48, rect.width - 8, 4);
          ctx.fillStyle = token('--identity-paper');
          ctx.fillRect(rect.left + 12, rect.top + 4, 40, 40);
          ctx.fillStyle = token('--identity-normal');
          ctx.fillRect(rect.left + 20, rect.top + 12, 24, 24);
          ctx.fillStyle = token('--identity-paper');
          ctx.fillRect(rect.left + 24, rect.top + 16, 16, 16);
          const macTitle = macWindow.querySelector('.mac-title');
          const titleRect = macTitle.getBoundingClientRect();
          ctx.fillRect(titleRect.left, titleRect.top, titleRect.width, titleRect.height);
          drawCenteredText(macTitle);

          // The SR sticker — a physical object on the glass; draw its actual
          // asset at the element's center with the resting tilt. Only the
          // pixel-mode face is drawn (the snapshot renders pixel chrome).
          const stickerImage = macWindow.querySelector('.sr-sticker .face-modern');
          if (!macWindow.classList.contains('super-res') &&
              stickerImage && stickerImage.complete && stickerImage.naturalWidth) {
            const stickerRect = stickerImage.getBoundingClientRect();
            const cx = stickerRect.left + stickerRect.width / 2;
            const cy = stickerRect.top + stickerRect.height / 2;
            const size = stickerImage.offsetWidth;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-12 * Math.PI / 180);
            ctx.drawImage(stickerImage, -size / 2, -size / 2, size, size);
            ctx.restore();
          }
        }
      };

      VisualIdentity.pixelateTo = url => {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          window.location.href = url;
          return;
        }

        const width = innerWidth;
        const height = innerHeight;
        const canvas = document.createElement('canvas');
        const source = document.createElement('canvas');
        const tiny = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const tinyCtx = tiny.getContext('2d');
        let frame = 0;

        canvas.className = 'pixel-transition';
        canvas.width = source.width = width;
        canvas.height = source.height = height;
        document.body.appendChild(canvas);
        VisualIdentity.drawPageSnapshot(source);

        const renderFrame = () => {
          const blockSize = VisualIdentity.pixelBlockSizes[frame];
          tiny.width = Math.max(1, Math.ceil(width / blockSize));
          tiny.height = Math.max(1, Math.ceil(height / blockSize));
          tinyCtx.imageSmoothingEnabled = true;
          tinyCtx.clearRect(0, 0, tiny.width, tiny.height);
          tinyCtx.drawImage(source, 0, 0, tiny.width, tiny.height);

          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(tiny, 0, 0, tiny.width, tiny.height, 0, 0, tiny.width * blockSize, tiny.height * blockSize);

          frame += 1;
          if (frame < VisualIdentity.pixelBlockSizes.length) {
            setTimeout(renderFrame, VisualIdentity.pixelFrameDelay);
          } else {
            window.location.href = url;
          }
        };

        renderFrame();
      };

      // Returning via the back/forward cache restores the page exactly as
      // it was left: pixelation overlay still painted, leaving latch still
      // set (which would also swallow every further click). Clean up.
      addEventListener('pageshow', event => {
        if (!event.persisted) return;
        leaving = false;
        document.querySelectorAll('.pixel-transition').forEach(el => el.remove());
      });

      document.addEventListener('click', event => {
        const link = event.target instanceof Element ? event.target.closest('a[data-identity-transition]') : null;
        if (moved && link?.classList.contains('draggable-item')) {
          event.preventDefault();
          return;
        }

        if (!link) return;
        if (leaving) {
          event.preventDefault();
          return;
        }

        const href = link.getAttribute('href');
        const opensElsewhere = link.target && link.target !== '_self';
        if (!href || href === '#' || opensElsewhere || link.download || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        event.preventDefault();
        leaving = true;
        if (link.dataset.identityTransition === 'pixelate') {
          VisualIdentity.pixelateTo(link.href);
        } else {
          window.location.href = link.href;
        }
      }, true);
      draggableItems.forEach(link => link.addEventListener('dragstart', event => event.preventDefault()));
    })();
  </script>
  <script src="version.js"></script>
  <script src="wallet.js"></script>
  <script src="news.md.js"></script>
  <script src="tv.js"></script>
  <script src="control-panel.js"></script>
  <script src="contacts.md.js"></script>
  <script src="contacts.js"></script>
  <script src="chat.data.js"></script>
  <script src="chat.js"></script>

  <!-- The welcome: an empty desk says nothing, so the reader arrives to the two
       windows that introduce the place — Contacts (who this is) and the TV (what
       is new). They are not there on load: the desk lands bare, then each icon
       visibly presses itself and its window opens on the release, so the reader
       reads it as something being opened rather than a page that rendered oddly.
       Contacts goes first, so the TV lands stepped over it and both stay legible;
       Messages is deliberately left shut, since its unread dot is the invitation.
       This runs last on purpose: each app registers its own DOMContentLoaded boot
       as it loads, so by the time this one fires their doors exist. -->
  <script>
    (() => {
      const WAIT_MS  = 800;   // beat before the first icon, and between them
      const PRESS_MS = 160;   // how long an icon stays pushed in

      const doors = [
        ['.contacts-icon', () => window.ContactsApp?.open?.()],
        ['.tv-icon',       () => window.TVApp?.open?.()],
      ];

      const welcome = () => {
        // On a phone an app fills the whole display, so opening two would bury
        // the first and hide the home screen the reader just arrived at. The
        // icons are the welcome there; they tap in themselves.
        if (window.VisualIdentity?.isPhone?.()) return;
        // Someone who asked for less motion just gets the windows, no theatre.
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          doors.forEach(([, open]) => open());
          return;
        }
        doors.forEach(([selector, open], i) => {
          setTimeout(() => {
            const icon = document.querySelector(selector);
            if (!icon) { open(); return; }
            icon.classList.add('pressed');
            setTimeout(() => {
              icon.classList.remove('pressed');
              open();                       // opens on the release, like a real click
            }, PRESS_MS);
          }, WAIT_MS * (i + 1));
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', welcome);
      } else {
        welcome();
      }
    })();
  </script>
</body>
</html>
