<!DOCTYPE html>
<!--
  Visual identity: everything on this page lives on an 8px pixel grid —
  positions, sizes, colors, and motion all snap to it.
  See STYLE_GUIDE.md before changing or adding anything.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jiali Ma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* DotGothic16 (SIL OFL) — self-hosted so it can carry size-adjust:
       its CJK glyphs fill the em and read oversized next to Enter Command;
       70% brings the ink heights into optical balance. */
    @font-face {
      font-family: "DotGothic16";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      size-adjust: 70%;
      src: url("fonts/DotGothic16.woff2") format("woff2");
    }

    /* Enter Command by jeti (public domain) — self-hosted pixel display
       face with true lowercase. Native 16-per-em grid: crisp at 16px. */
    @font-face {
      font-family: "Enter Command";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/EnterCommand.woff2") format("woff2");
    }

    @font-face {
      font-family: "Enter Command";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/EnterCommand-Bold.woff2") format("woff2");
    }
    :root {
      color-scheme: light;
      /* Primary: the identity color — interaction, focus, brand highlights. */
      --identity-primary: #4f46e5;
      /* Primary-ink: the accent as legible text on paper (links, years, hover).
         Equals primary for indigo and in dark mode, where the primary already
         reads; light pastels deepen it so text holds its contrast on white. */
      --identity-primary-ink: #4f46e5;
      /* Ring: the accent as an understated avatar outline — a lighter tone in
         light mode, a deeper one in dark, so the circle reads without shouting.
         Seafoam overrides light to its soft primary; others use tint-deep. */
      --identity-ring: var(--identity-tint-deep);
      /* Accent set: categorical highlights only, never interaction.
         Each hue has a strong (ink-level) and a soft (fill-level) form. */
      --identity-accent-pink: #db2777;
      --identity-accent-pink-soft: #fbcfe8;
      --identity-accent-amber: #d97706;
      --identity-accent-amber-soft: #fde68a;
      --identity-accent-green: #059669;
      --identity-accent-green-soft: #a7f3d0;
      --identity-accent-cyan: #0891b2;
      --identity-accent-cyan-soft: #a5f3fc;
      --identity-normal: #000;
      /* Surfaces: paper + the primary tint ramp used for structural
         shading. Every surface color on the page consumes these tokens —
         that's what makes dark mode a palette swap, not a redesign. */
      --identity-paper: #ffffff;
      --identity-tint-deep: #a5b4fc;    /* creases, pressed fills */
      --identity-tint-mid: #c7d2fe;     /* flaps, hover fills, scrollbar */
      --identity-tint-soft: #dbe2ff;    /* inner-edge surface shading */
      --identity-tint-shadow: #e0e7ff;  /* drop shadows */
      --identity-gray: #6b7280;         /* secondary text */
      --identity-color-in: 360ms;
      --identity-color-out: 560ms;
      --identity-color-steps: 5;
      --identity-pixel-size: 8px;
      --font-display: "Enter Command", "Silkscreen", monospace;
      --font-content: "Enter Command", "Silkscreen", "DotGothic16", monospace;
    }

    /* Dark mode: the same machine at night. Ink and paper swap (dark paper
       is the asset-ink near-black), structural shading flips to the dark
       side of the primary ramp (indigo 950..700 mirroring 100..300), and
       primary glows one step brighter. Physical objects (sticker, cards)
       and lit screens (the TV picture, TV-icon glass) do NOT change —
       they are objects and emitters, not page paper. The swap is instant:
       a palette swap, per the motion law. */
    html[data-theme="dark"] {
      color-scheme: dark;
      --identity-normal: #ffffff;
      --identity-paper: #17151f;
      --identity-primary: #818cf8;
      --identity-primary-ink: #818cf8;
      --identity-ring: var(--identity-tint-deep);
      --identity-tint-deep: #4338ca;
      --identity-tint-mid: #3730a3;
      --identity-tint-soft: #312e81;
      --identity-tint-shadow: #1e1b4b;
      --identity-gray: #9ca3af;
    }

    /* Seafoam accent — the OS's one alternate look, selectable in the Control
       Panel (Looks). A soft, airy 90s-anime pastel from the #b6ded1 seafoam
       family, saturated up to a luminous glass-aqua (#82e3c0) for the primary;
       accent *text* uses a deeper ink (--identity-primary-ink) so it stays
       legible on paper. A gentle seafoam over a pale tint ramp in light, and a
       bright
       seafoam primary over a muted-dark ramp in dark. Same palette-swap trick
       as dark mode — only the primary + tints change; ink, paper and gray stay
       — so it layers on top and works in both modes. */
    html[data-accent="seafoam"] {
      --identity-primary: #82e3c0;
      --identity-primary-ink: #1f8c68;
      --identity-ring: var(--identity-primary);
      --identity-tint-deep: #cdece1;
      --identity-tint-mid: #deeee9;
      --identity-tint-soft: #eaf2ef;
      --identity-tint-shadow: #f5f8f7;
    }

    html[data-theme="dark"][data-accent="seafoam"] {
      --identity-primary: #8ee1c5;
      --identity-primary-ink: #8ee1c5;
      --identity-ring: var(--identity-tint-deep);
      --identity-tint-deep: #4c9a81;
      --identity-tint-mid: #3f7d6c;
      --identity-tint-soft: #326256;
      --identity-tint-shadow: #284b43;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--identity-paper);
    }

    .pixel-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      width: 100vw;
      height: 100vh;
      background: var(--identity-paper);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    @media (prefers-reduced-motion: reduce) {
      .pixel-transition { display: none; }
    }

    .draggable-item {
      position: fixed;
      touch-action: none;
      cursor: grab;
    }

    .draggable-item.dragging { cursor: grabbing; }

    .identity-color,
    .identity-pixel-color,
    .pub-title a {
      color: var(--identity-normal);
      text-decoration: none;
      transition: color var(--identity-color-out) steps(var(--identity-color-steps), end);
    }

    .identity-color:hover,
    .identity-color:focus-visible,
    .identity-pixel-color:hover,
    .identity-pixel-color:focus-visible,
    .pub-title a:hover,
    .pub-title a:focus-visible {
      color: var(--identity-primary-ink);
      text-decoration: none;
      transition-duration: var(--identity-color-in);
    }

    .identity-color:focus-visible,
    .identity-pixel-color:focus-visible,
    .pub-title a:focus-visible {
      outline: 2px solid var(--identity-primary);
      outline-offset: 4px;
    }

    /* Shared shell for all pixel icons; alignToGrid lays them out as a
       centered row on the grid. */
    .pixel-icon {
      z-index: 2;
      width: 112px;
      height: 160px;
      padding: 0;
      border: 0;
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .documentation-icon,
    .wallet-icon,
    .tv-icon,
    .controls-icon,
    .chat-icon,
    .contacts-icon {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* Icons need not share width — the shell height and label row stay
       uniform, the box fits the subject (document: portrait; wallet and
       TV: landscape). */
    .wallet-icon,
    .tv-icon { width: 144px; }
    /* Contacts runs wider than the default: the book needs room for its
       fore-edge page block AND the index tabs standing out past it. */
    .contacts-icon { width: 128px; }

    /* Every .doc-px is one solid rect on the 8px grid; DOM order = paint order.
       currentColor pieces inherit the button's ink and follow its hover transition. */
    .doc-px {
      position: absolute;
      display: block;
    }

    .px-shadow-b { left: 16px;  top: 128px; width: 88px; height: 8px;   background: var(--identity-tint-shadow); }
    .px-shadow-r { left: 104px; top: 32px;  width: 8px;  height: 104px; background: var(--identity-tint-shadow); }

    .px-paper-top  { left: 16px; top: 8px;  width: 64px; height: 8px;   background: var(--identity-paper); }
    .px-paper-main { left: 16px; top: 16px; width: 80px; height: 104px; background: var(--identity-paper); }

    .px-shade-b { left: 16px; top: 112px; width: 80px; height: 8px;  background: var(--identity-tint-soft); }
    .px-shade-r { left: 88px; top: 32px;  width: 8px;  height: 88px; background: var(--identity-tint-soft); }

    .px-fold-1 { left: 72px; top: 8px;  width: 8px;  height: 8px; background: var(--identity-tint-mid); }
    .px-fold-2 { left: 72px; top: 16px; width: 16px; height: 8px; background: var(--identity-tint-mid); }
    .px-fold-3 { left: 72px; top: 24px; width: 24px; height: 8px; background: var(--identity-tint-deep); }

    .px-edge-left   { left: 8px;  top: 0;     width: 8px;  height: 128px; background: currentColor; }
    .px-edge-top    { left: 8px;  top: 0;     width: 72px; height: 8px;   background: currentColor; }
    .px-edge-step1  { left: 80px; top: 8px;   width: 8px;  height: 8px;   background: currentColor; }
    .px-edge-step2  { left: 88px; top: 16px;  width: 8px;  height: 8px;   background: currentColor; }
    .px-edge-step3  { left: 96px; top: 24px;  width: 8px;  height: 8px;   background: currentColor; }
    .px-edge-right  { left: 96px; top: 32px;  width: 8px;  height: 88px;  background: currentColor; }
    .px-edge-bottom { left: 8px;  top: 120px; width: 96px; height: 8px;   background: currentColor; }

    .px-line-1 { left: 24px; top: 40px; width: 48px; height: 8px; background: var(--identity-primary); }
    .px-line-2 { left: 24px; top: 56px; width: 64px; height: 8px; background: currentColor; }
    .px-line-3 { left: 24px; top: 72px; width: 56px; height: 8px; background: currentColor; }
    .px-line-4 { left: 24px; top: 88px; width: 40px; height: 8px; background: currentColor; }

    /* Profile icon: a card wallet — the fun CV, landscape (144px box).
       Apple-Wallet composition on the pixel grid: white wallet back with
       1-step rounded top, tone-on-tone card layers (primary tints — the
       approved reference separates layers by tone, not hue), and a front
       pocket whose rim scoops down in the center revealing the card. */
    .px-w-shadow-r { left: 136px; top: 32px;  width: 8px;   height: 104px; background: var(--identity-tint-shadow); }
    .px-w-shadow-b { left: 16px;  top: 128px; width: 120px; height: 8px;   background: var(--identity-tint-shadow); }

    .px-w-back-fill { left: 16px; top: 24px; width: 112px; height: 40px; background: var(--identity-paper); }
    .px-w-back-top  { left: 16px; top: 16px; width: 112px; height: 8px;  background: currentColor; }
    .px-w-back-l    { left: 8px;  top: 24px; width: 8px;   height: 40px; background: currentColor; }
    .px-w-back-r    { left: 128px; top: 24px; width: 8px;  height: 40px; background: currentColor; }
    .px-w-layer1 { left: 16px; top: 32px; width: 112px; height: 32px; background: var(--identity-tint-soft); }
    .px-w-layer2 { left: 16px; top: 48px; width: 112px; height: 16px; background: var(--identity-tint-mid); }

    .px-w-fill     { left: 16px;  top: 72px;  width: 112px; height: 48px; background: var(--identity-paper); }
    .px-w-shade-b2 { left: 16px;  top: 112px; width: 112px; height: 8px;  background: var(--identity-tint-soft); }
    .px-w-shade-r2 { left: 120px; top: 80px;  width: 8px;   height: 32px; background: var(--identity-tint-soft); }
    .px-w-reveal-a { left: 48px;  top: 64px;  width: 48px;  height: 8px;  background: var(--identity-tint-mid); }
    .px-w-reveal-b { left: 56px;  top: 72px;  width: 32px;  height: 8px;  background: var(--identity-tint-mid); }
    .px-w-rim-l    { left: 8px;   top: 64px;  width: 40px;  height: 8px;  background: currentColor; }
    .px-w-rim-r    { left: 96px;  top: 64px;  width: 40px;  height: 8px;  background: currentColor; }
    .px-w-scoop-wl { left: 48px;  top: 72px;  width: 8px;   height: 8px;  background: currentColor; }
    .px-w-scoop-wr { left: 88px;  top: 72px;  width: 8px;   height: 8px;  background: currentColor; }
    .px-w-scoop-b  { left: 56px;  top: 80px;  width: 32px;  height: 8px;  background: currentColor; }
    .px-w-side-l   { left: 8px;   top: 72px;  width: 8px;   height: 48px; background: currentColor; }
    .px-w-side-r   { left: 128px; top: 72px;  width: 8px;   height: 48px; background: currentColor; }
    .px-w-bottom   { left: 8px;   top: 120px; width: 128px; height: 8px;  background: currentColor; }

    /* TV icon: a rabbit-ear CRT TV — white body, primary-lit screen
       (the one accent), knob panel right. Parts prefixed px-n-*. */
    .px-n-shadow-r { left: 136px; top: 48px;  width: 8px;   height: 88px; background: var(--identity-tint-shadow); }
    .px-n-shadow-b { left: 16px;  top: 128px; width: 128px; height: 8px;  background: var(--identity-tint-shadow); }

    .px-n-ant-l1 { left: 32px;  top: 0;    width: 8px;  height: 8px; background: currentColor; }

    .px-n-ant-r1 { left: 104px; top: 0;    width: 8px;  height: 8px; background: currentColor; }
    .px-n-ant-r2 { left: 96px;  top: 8px;  width: 8px;  height: 8px; background: currentColor; }
    .px-n-ant-r3 { left: 88px;  top: 16px; width: 8px;  height: 8px; background: currentColor; }

    .px-n-ant-base { left: 64px; top: 32px; width: 16px; height: 8px; background: currentColor; }

    .px-n-tv-top    { left: 8px;   top: 40px;  width: 128px; height: 8px;  background: currentColor; }
    .px-n-tv-left   { left: 8px;   top: 48px;  width: 8px;   height: 72px; background: currentColor; }
    .px-n-tv-right  { left: 128px; top: 48px;  width: 8px;   height: 72px; background: currentColor; }
    .px-n-tv-bottom { left: 8px;   top: 120px; width: 128px; height: 8px;  background: currentColor; }
    .px-n-tv-fill   { left: 16px;  top: 48px;  width: 112px; height: 72px; background: var(--identity-paper); }

    .px-n-scr-top    { left: 16px; top: 48px;  width: 80px; height: 8px;  background: currentColor; }
    .px-n-scr-bottom { left: 16px; top: 112px; width: 80px; height: 8px;  background: currentColor; }
    .px-n-scr-left   { left: 16px; top: 56px;  width: 8px;  height: 56px; background: currentColor; }
    .px-n-scr-right  { left: 88px; top: 56px;  width: 8px;  height: 56px; background: currentColor; }
    .px-n-scr-fill   { left: 24px; top: 56px;  width: 64px; height: 56px; background: var(--identity-primary); }
    .px-n-glint-a    { left: 32px; top: 64px;  width: 16px; height: 8px;  background: #fff; }

    .px-n-knob-2 { left: 104px; top: 80px; width: 16px; height: 16px; background: var(--identity-tint-mid); }

    /* Controls icon: a slider panel — three tint tracks, ink knobs, one
       primary knob (the accent). Parts prefixed px-c-*. */
    .px-c-shadow-r { left: 104px; top: 48px;  width: 8px;  height: 80px; background: var(--identity-tint-shadow); }
    .px-c-shadow-b { left: 16px;  top: 120px; width: 96px; height: 8px;  background: var(--identity-tint-shadow); }

    /* Messages icon: a speech bubble (tail bottom-left, one primary line —
       the document-icon language) with an unread badge. Parts px-m-*. */
    .px-m-shadow-r  { left: 104px; top: 48px; width: 8px;  height: 56px; background: var(--identity-tint-shadow); }
    .px-m-shadow-t1 { left: 32px; top: 104px; width: 24px; height: 8px;  background: var(--identity-tint-shadow); }

    /* The unread badge: accent-pink (the palette's red), paper halo like
       the close box, blinking in hard steps. Hidden once read. */
    .px-m-badge {
      left: 88px;
      top: 32px;
      width: 16px;
      height: 16px;
      background: var(--identity-accent-pink);
      box-shadow: 0 0 0 4px var(--identity-paper);
    }

    .chat-icon:not(.unread) .px-m-badge { display: none; }

    .chat-icon.unread .px-m-badge {
      animation: chat-badge 1200ms step-end infinite;
    }

    @keyframes chat-badge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .chat-icon.unread .px-m-badge { animation: none; }
    }

    /* Contacts icon: the address book — an outlined person (tint fill) on the
       cover, with the page block wrapping the bottom AND the right fore-edge
       so it reads as a bound volume with real thickness rather than a loose
       sheet, and three index tabs standing out of the pages, the middle one
       primary (the open letter). Parts prefixed px-ct-*.

       The shadow is the book's silhouette offset exactly one cell down-right,
       which is what lets the :active press land the art perfectly on top of
       it. The tabs cast none of their own — they read as thin paper. */
    /* The book is two planes, not one outline: the page block is a rectangle
       (x 24-104, y 32-120) sitting BEHIND the cover (x 8-88, y 16-104) and
       extruded 16px down-right, so the silhouette steps out on the right and
       in on the left — that step is the perspective. Only the parts of the
       block the cover does not hide get drawn. The tabs then grow out of the
       block's own right edge, at the pages' depth, not off the cover. */
    .px-ct-shadow-r { left: 104px; top: 40px;  width: 8px;  height: 88px; background: var(--identity-tint-shadow); }
    .px-ct-shadow-b { left: 24px;  top: 120px; width: 88px; height: 8px;  background: var(--identity-tint-shadow); }

    /* The depth edges: 45° staircases running from the cover's corners to the
       block's, sealing the two planes into ONE volume. Without them the cover
       and the block read as two cards lying on each other, not as a book. The
       top-right pair starts a cell below the cover's corner, so the thickness
       eases in rather than springing straight out of the corner. */
    .px-ct-depth-tr1 { left: 88px; top: 24px;  width: 8px; height: 8px; background: currentColor; }
    .px-ct-depth-tr2 { left: 96px; top: 32px;  width: 8px; height: 8px; background: currentColor; }
    .px-ct-depth-bl1 { left: 8px;  top: 104px; width: 8px; height: 8px; background: currentColor; }
    .px-ct-depth-bl2 { left: 16px; top: 112px; width: 8px; height: 8px; background: currentColor; }

    /* The page block, behind: the pages themselves, closed by the block's
       outer edges. */
    .px-ct-pages-r { left: 88px; top: 32px;  width: 8px;  height: 80px; background: var(--identity-tint-soft); }
    .px-ct-pages-b { left: 16px; top: 104px; width: 72px; height: 8px;  background: var(--identity-tint-soft); }
    .px-ct-block-r { left: 96px; top: 40px;  width: 8px;  height: 80px; background: currentColor; }
    .px-ct-block-b { left: 24px; top: 112px; width: 80px; height: 8px;  background: currentColor; }

    /* The cover, in front — it hides the rest of the block. */
    .px-ct-top    { left: 8px;  top: 16px; width: 80px; height: 8px;  background: currentColor; }
    .px-ct-left   { left: 8px;  top: 24px; width: 8px;  height: 72px; background: currentColor; }
    .px-ct-right  { left: 80px; top: 24px; width: 8px;  height: 72px; background: currentColor; }
    .px-ct-fill   { left: 16px; top: 24px; width: 64px; height: 72px; background: var(--identity-paper); }
    .px-ct-bottom { left: 8px;  top: 96px; width: 80px; height: 8px;  background: currentColor; }

    /* Index tabs: they belong to the COVER's plane, springing from its right
       edge and crossing the fore-edge to stand one cell proud of the book's
       edge. They start below the depth staircase so it stays readable. */
    /* tint-deep, not tint-mid: these now sit ON the tint-soft pages rather than
       against bare paper, and mid is too close to soft to register there. */
    .px-ct-tab-1 { left: 88px; top: 40px; width: 24px; height: 16px; background: var(--identity-tint-deep); }
    .px-ct-tab-2 { left: 88px; top: 64px; width: 24px; height: 16px; background: var(--identity-primary); }
    .px-ct-tab-3 { left: 88px; top: 88px; width: 24px; height: 16px; background: var(--identity-tint-deep); }

    .px-ct-head-top    { left: 40px; top: 32px; width: 16px; height: 8px;  background: currentColor; }
    .px-ct-head-l      { left: 32px; top: 40px; width: 8px;  height: 16px; background: currentColor; }
    .px-ct-head-r      { left: 56px; top: 40px; width: 8px;  height: 16px; background: currentColor; }
    .px-ct-head-fill   { left: 40px; top: 40px; width: 16px; height: 16px; background: var(--identity-tint-soft); }
    .px-ct-head-bottom { left: 40px; top: 56px; width: 16px; height: 8px;  background: currentColor; }
    .px-ct-torso-top   { left: 32px; top: 64px; width: 32px; height: 8px;  background: currentColor; }
    .px-ct-torso-l     { left: 24px; top: 72px; width: 8px;  height: 24px; background: currentColor; }
    .px-ct-torso-r     { left: 64px; top: 72px; width: 8px;  height: 24px; background: currentColor; }
    .px-ct-torso-fill  { left: 32px; top: 72px; width: 32px; height: 24px; background: var(--identity-tint-soft); }

    /* Press feedback: the art snaps one grid cell onto its own drop shadow,
       so the icon reads as physically pushed in. Instant, no easing — pixel style.
       .pressed is the same look driven from script, so the welcome can show the
       reader an icon being opened instead of windows just appearing. */
    .pixel-icon:is(:active, .pressed) .doc-px { translate: 8px 8px; }

    .pixel-icon:is(:active, .pressed) :is(
      .px-shadow-b,
      .px-shadow-r,
      .px-w-shadow-r,
      .px-w-shadow-b,
      .px-n-shadow-r,
      .px-n-shadow-b,
      .px-c-shadow-r,
      .px-c-shadow-b,
      .px-m-shadow-r,
      .px-m-shadow-b,
      .px-m-shadow-t1,
      .px-m-shadow-t2,
      .px-ct-shadow-r,
      .px-ct-shadow-b) { translate: none; }

    .doc-label {
      position: absolute;
      left: 0;
      top: 136px;
      width: 100%;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 24px;
      -webkit-font-smoothing: none;
      font-smooth: never;
      text-align: center;
      color: inherit;
    }

    /* Retro Macintosh-style window: striped title bar, close box on the
       upper left, 4px "virtual pixel" chrome on the identity palette. */
    .mac-window {
      position: fixed;
      z-index: 30;
      width: min(560px, calc(100vw - 48px));
      background: var(--identity-paper);
      border: 4px solid var(--identity-normal);
      box-shadow: 8px 8px 0 var(--identity-tint-shadow);
      /* Content stack is Silkscreen-first with a Japanese font covering CJK —
         both bitmap-styled, so smoothing stays off. */
      font-family: var(--font-content);
      font-size: 16px;
      line-height: 24px;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    .mac-titlebar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-bottom: 4px solid var(--identity-normal);
      background: linear-gradient(
        to bottom,
        var(--identity-paper) 0 8px, var(--identity-normal) 8px 12px,
        var(--identity-paper) 12px 20px, var(--identity-normal) 20px 24px,
        var(--identity-paper) 24px 32px, var(--identity-normal) 32px 36px,
        var(--identity-paper) 36px
      );
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* The window receives programmatic focus on open (for Escape handling);
       suppress the browser's default focus ring — it isn't tabbable. */
    .mac-window:focus { outline: none; }

    .mac-window.dragging .mac-titlebar { cursor: grabbing; }

    .mac-title {
      margin: 0;
      padding: 0 16px;
      background: var(--identity-paper);
      /* Title bars are chrome, not content: Silkscreen at its native 16px
         (the optical match for Enter Command 24) — the one place the
         fallback face leads the stack. */
      font-family: "Silkscreen", var(--font-display);
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    .mac-close {
      position: absolute;
      left: 16px;
      top: 8px;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 4px solid var(--identity-normal);
      background: var(--identity-paper);
      box-shadow: 0 0 0 8px var(--identity-paper);
      cursor: pointer;
    }

    .mac-close:hover,
    .mac-close:focus-visible {
      background: var(--identity-tint-mid);
    }

    .mac-close:active { background: var(--identity-primary); }

    .mac-close:focus-visible {
      outline: 2px solid var(--identity-primary);
      outline-offset: 6px;
    }

    /* Super-resolution sticker: a physical vinyl sticker (sr-sticker.svg)
       stuck on the window's bottom-right corner. As a real-world object on
       the screen glass (like the cursor), it is exempt from the pixel laws.
       The asset carries the print; the button carries placement, tilt,
       cast shadow, and the lift/press physics. Toggles super-resolution mode. */
    .sr-sticker {
      position: absolute;
      right: -24px;
      bottom: -28px;
      z-index: 5;
      width: 112px;
      height: 112px;
      padding: 0;
      border: none;
      background: transparent;
      transform: rotate(-12deg);
      cursor: pointer;
      touch-action: none;
      transition: transform 150ms ease;
    }

    /* Peeling: the sticker is physical — it can be tugged and torn off. */
    .sr-sticker.peeling {
      transition: none;
      cursor: grabbing;
    }

    .sr-sticker.peeled {
      animation: sticker-peel-away 420ms ease-in forwards;
      pointer-events: none;
    }

    @keyframes sticker-peel-away {
      from { opacity: 1; }
      to {
        opacity: 0;
        visibility: hidden;
        transform: translate(var(--peel-x, 80px), var(--peel-y, 120px)) rotate(28deg) scale(0.85);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sr-sticker.peeled {
        animation: none;
        opacity: 0;
        visibility: hidden;
      }
    }

    .sr-sticker .face-modern {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sr-sticker .face-classic { display: none; }

    .sr-sticker:hover,
    .sr-sticker:focus-visible {
      transform: rotate(-8deg) scale(1.06);
    }

    .sr-sticker:active {
      transform: rotate(-10deg) scale(0.96);
    }

    .sr-sticker:focus-visible {
      outline: 2px solid var(--identity-primary);
      outline-offset: 4px;
    }

    /* Slap-on: the sticker lands on the window a beat after it opens
       (--sr-slap-delay, ~10s on open so it surfaces once you've settled
       in; snappy on a manual mode-flip), and again when the mode flips.
       backwards fill holds the `from` frame through the delay, so it stays
       invisible AND non-interactive until it lands. */
    .sr-sticker.slapped {
      animation: sticker-slap-modern 240ms ease-out var(--sr-slap-delay, 220ms) backwards;
    }

    @keyframes sticker-slap-modern {
      from { opacity: 0; transform: rotate(-26deg) scale(1.7); pointer-events: none; }
      65% { opacity: 1; transform: rotate(-9deg) scale(0.94); }
      to { transform: rotate(-12deg) scale(1); pointer-events: auto; }
    }

    /* In super-resolution mode the sticker flips: a pixel-art pop-up
       offering the way home. Each face advertises the other world.
       Unlike the sticker, the pop-up is screen content, not a physical
       object — it sits in the title bar, aligned with title and close. */
    .super-res .sr-sticker {
      width: auto;
      height: auto;
      right: 12px;
      top: 4px;
      bottom: auto;
      transform: none;
      transform-origin: right center;
    }

    .super-res .sr-sticker .face-modern { display: none; }

    /* Pixel-rounded dialog drawn as a fixed-size inline SVG: integer
       dimensions and crispEdges paths keep the 1px outline uniform at
       every DPR (a text-sized box goes fractional and renders the
       hairline unevenly). Inline SVG shares the document's fonts, so the
       label stays Silkscreen. */
    .super-res .sr-sticker .face-classic {
      display: block;
      width: 112px;
      height: 48px;
    }

    .super-res .sr-sticker .face-classic path { shape-rendering: crispEdges; }

    .super-res .sr-sticker .face-classic-bg { fill: var(--identity-accent-amber-soft); }

    .super-res .sr-sticker .face-classic text {
      font-family: var(--font-display);
      font-size: 24px;
      fill: #000;
    }

    .super-res .sr-sticker:hover,
    .super-res .sr-sticker:focus-visible { transform: none; }

    .super-res .sr-sticker:hover .face-classic-bg,
    .super-res .sr-sticker:focus-visible .face-classic-bg { fill: #fff; }

    .super-res .sr-sticker:active { transform: translate(4px, 4px); }

    /* Retro pop-in: discrete frames only — the box snaps through three
       sizes with no in-between rendering, like an RPG dialog opening.
       Deliberately late: the way back reveals itself after a beat, not
       the instant the mode flips. */
    .super-res .sr-sticker.slapped {
      animation-name: sticker-slap-classic;
      animation-timing-function: step-end;
      animation-delay: 1100ms;
    }

    @keyframes sticker-slap-classic {
      0% { opacity: 0; transform: scale(0.4); }
      1% { opacity: 1; }
      33% { transform: scale(0.6); }
      66% { transform: scale(0.85); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sr-sticker.slapped { animation: none; }
    }

    .mac-content {
      padding: 24px;
      max-height: min(480px, calc(100vh - 240px));
      overflow-y: auto;
    }

    .mac-content::-webkit-scrollbar { width: 24px; }
    .mac-content::-webkit-scrollbar-track { background: var(--identity-paper); border-left: 4px solid var(--identity-normal); }
    /* No right border: the scrollbar is flush against the window's ink
       frame, so a thumb border-right would stack with the frame into a
       doubled 8px edge. The frame IS the right wall — keeps left/right even. */
    .mac-content::-webkit-scrollbar-thumb { background: var(--identity-tint-mid); border: 4px solid var(--identity-normal); border-right: 0; }

    .pub-section + .pub-section { margin-top: 32px; }

    .pub-section-title {
      margin: 0 0 16px;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      line-height: 24px;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    /* One colored cell as the section marker — accent hue per category. */
    .pub-section-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      vertical-align: 2px;
      background: var(--identity-primary);
    }

    .pub-section[data-section='journal'] .pub-section-title::before { background: var(--identity-accent-amber); }
    .pub-section[data-section='international'] .pub-section-title::before { background: var(--identity-primary); }
    .pub-section[data-section='domestic'] .pub-section-title::before { background: var(--identity-accent-green); }
    .pub-section[data-section='preprint'] .pub-section-title::before { background: var(--identity-accent-cyan); }
    .pub-section[data-section='other'] .pub-section-title::before { background: var(--identity-accent-pink); }

    .pub-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .pub-list li + li { margin-top: 24px; }

    /* Enter Command's caps at 24px optically match Silkscreen's at 16px.
       Its ink is small within the em (44% cap height — terminal-font
       design), so solid 24px leading reads normal, not cramped. */
    .pub-title {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 400;
      line-height: 24px;
    }

    .pub-meta {
      margin: 0;
      font-size: 24px;
      font-weight: 400;
      line-height: 24px;
      color: var(--identity-gray);
    }

    /* The site owner's name stands out from the gray author list. */
    .pub-self {
      color: var(--identity-normal);
      font-weight: 700;
    }

    .pub-year { color: var(--identity-primary-ink); }

    /* Material buttons under a paper (slides / paper / poster). Clicking one
       doesn't download straight off — it opens Messages and Jiali sends you the
       file like a DM (chat.js ChatApp.share). Text-only pixel pills. */
    .pub-actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    .pub-material {
      position: relative;
      isolation: isolate;
      display: inline-block;
      padding: 4px 12px;
      border: 0;               /* strip the UA <button> border (kept box at 28px) */
      appearance: none;
      -webkit-appearance: none;
      /* Pixel-art fully-rounded pill, done as two stacked stepped shapes: this
         element is the outline colour clipped to the OUTER stadium silhouette,
         and ::before is the fill clipped to that same silhouette eroded ~2px
         inward — so a crisp pixel outline traces the whole perimeter, stepped
         end-caps included. (The old gradient-border trick left the corners un-
         outlined: its square-cornered padding-box met the stepped silhouette
         with no room for the border.) The caps are stepped semicircles of
         radius = half the box height; the polygons assume a 24px-tall box
         (16px line + 2×4px padding, no border) — the caps stay circular and
         the straight mid-section (the calc(100% - …) run) stretches if it
         changes. */
      background: var(--identity-primary-ink);
      color: var(--identity-primary-ink);
      font: inherit;
      font-size: 16px;
      line-height: 16px;
      cursor: pointer;
      clip-path: polygon(
        8px 0, calc(100% - 8px) 0,
        calc(100% - 8px) 2px, calc(100% - 4px) 2px, calc(100% - 4px) 4px, calc(100% - 2px) 4px, calc(100% - 2px) 8px, 100% 8px,
        100% calc(100% - 8px),
        calc(100% - 2px) calc(100% - 8px), calc(100% - 2px) calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) calc(100% - 2px), calc(100% - 8px) calc(100% - 2px), calc(100% - 8px) 100%,
        8px 100%,
        8px calc(100% - 2px), 4px calc(100% - 2px), 4px calc(100% - 4px), 2px calc(100% - 4px), 2px calc(100% - 8px), 0 calc(100% - 8px),
        0 8px,
        2px 8px, 2px 4px, 4px 4px, 4px 2px, 8px 2px
      );
    }
    .pub-material::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;             /* paints above this element's ink bg, below the label */
      background: var(--identity-tint-soft);
      clip-path: polygon(
        8px 2px, calc(100% - 8px) 2px,
        calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, calc(100% - 2px) 8px,
        calc(100% - 2px) calc(100% - 8px),
        calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) calc(100% - 2px),
        8px calc(100% - 2px),
        8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 2px calc(100% - 8px),
        2px 8px,
        4px 8px, 4px 4px, 8px 4px
      );
    }
    /* Hover deepens only the fill (::before); the outline is this element's own
       background — a separate layer, so it can never vanish. */
    .pub-material:hover::before { background: var(--identity-tint-mid); }
    .pub-material:active { translate: 2px 2px; }
    .pub-material:focus-visible {
      outline: 2px solid var(--identity-primary);
      outline-offset: 2px;
    }

    /* ------------------------------------------------------------------ *
     * Super-resolution mode — the one sanctioned exception to the pixel
     * laws, scoped strictly to .mac-window.super-res (toggled by the zoom
     * box). The window "renders at native resolution" in our own future:
     * frosted glass built from the identity tokens (paper and primary at
     * partial alpha), a primary light-line signature, glass controls.
     * Nothing outside this window ever adopts these styles.
     * ------------------------------------------------------------------ */
    .mac-window.super-res {
      --sr-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
      font-family: var(--sr-font);
      -webkit-font-smoothing: antialiased;
      font-smooth: auto;
      border: 1px solid rgba(79, 70, 229, 0.22);
      border-radius: 20px;
      /* No overflow clipping — the sticker overhangs the corner. */
      background: rgba(255, 255, 255, 0.58);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      backdrop-filter: blur(24px) saturate(1.5);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        0 24px 64px -16px rgba(79, 70, 229, 0.35),
        0 4px 16px rgba(0, 0, 0, 0.06);
    }

    /* The title bar floats over the content with no explicit edge: content
       scrolls beneath it, progressively blurred — the backdrop blur fades
       out through a gradient mask instead of ending at a border. */
    .super-res .mac-titlebar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      height: 56px;
      background: transparent;
      border-bottom: none;
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
    }

    /* The identity signature: a primary light-line along the top edge. */
    .super-res .mac-titlebar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--identity-primary), transparent);
      opacity: 0.8;
    }

    .super-res .mac-title {
      /* Left-aligned next to the close button, modern app-header style —
         leaves the bar's right side to the classic pop-up. */
      position: absolute;
      left: 56px;
      top: 50%;
      translate: 0 -50%;
      padding: 0;
      font-family: var(--sr-font);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b7280;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      font-smooth: auto;
    }

    /* Glass close control — fully round. */
    .super-res .mac-close {
      width: 28px;
      height: 28px;
      top: 14px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      color: #6b7280;
    }

    .super-res .mac-close:hover,
    .super-res .mac-close:focus-visible {
      border-color: var(--identity-primary);
      color: var(--identity-primary-ink);
      background: rgba(255, 255, 255, 0.85);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        0 0 14px rgba(79, 70, 229, 0.35);
    }

    .super-res .mac-close:active {
      background: rgba(79, 70, 229, 0.16);
    }

    /* Close glyph: a thin x. */
    .super-res .mac-close::before,
    .super-res .mac-close::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 1.5px;
      background: currentColor;
      border-radius: 1px;
    }

    .super-res .mac-close::before { transform: translate(-50%, -50%) rotate(45deg); }
    .super-res .mac-close::after { transform: translate(-50%, -50%) rotate(-45deg); }

    .super-res .mac-content {
      /* Title bar is out of flow — content starts beneath it and scrolls
         under the progressive blur. */
      padding: 64px 28px 24px;
      border-radius: 0 0 20px 20px;
    }

    .super-res .pub-section-title {
      font-family: var(--sr-font);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      -webkit-font-smoothing: antialiased;
      font-smooth: auto;
    }

    .super-res .pub-section-title::before { border-radius: 2px; }

    .super-res .pub-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .super-res .pub-title a { transition: color 150ms ease; }

    .super-res .pub-meta {
      font-size: 14px;
      line-height: 1.6;
    }

    .super-res .pub-self { font-weight: 600; }

    .super-res .pub-year {
      display: inline-block;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(79, 70, 229, 0.12);
      font-size: 12px;
      line-height: 20px;
    }

    .super-res .mac-content::-webkit-scrollbar { width: 10px; }
    .super-res .mac-content::-webkit-scrollbar-track { background: transparent; border: none; }
    .super-res .mac-content::-webkit-scrollbar-thumb {
      background: rgba(79, 70, 229, 0.28);
      border: none;
      border-radius: 5px;
    }

    .super-res .mac-content::-webkit-scrollbar-thumb:hover {
      background: rgba(79, 70, 229, 0.45);
    }

    /* Dark-mode glass: the same frosted window over a dark room — dark
       paper at partial alpha, softer inner highlight, primary glow tuned
       to the brighter dark-primary. Text colors follow the tokens. */
    html[data-theme="dark"] .mac-window.super-res {
      border: 1px solid rgba(129, 140, 248, 0.28);
      background: rgba(23, 21, 31, 0.62);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 24px 64px -16px rgba(129, 140, 248, 0.28),
        0 4px 16px rgba(0, 0, 0, 0.5);
    }

    html[data-theme="dark"] .super-res .mac-close {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(23, 21, 31, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    html[data-theme="dark"] .super-res .mac-close:hover,
    html[data-theme="dark"] .super-res .mac-close:focus-visible {
      border-color: var(--identity-primary);
      background: rgba(23, 21, 31, 0.85);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 0 14px rgba(129, 140, 248, 0.35);
    }

    html[data-theme="dark"] .super-res .mac-close:active {
      background: rgba(129, 140, 248, 0.25);
    }

    html[data-theme="dark"] .super-res .pub-year {
      background: rgba(129, 140, 248, 0.22);
    }

    html[data-theme="dark"] .super-res .mac-content::-webkit-scrollbar-thumb {
      background: rgba(129, 140, 248, 0.35);
    }

    html[data-theme="dark"] .super-res .mac-content::-webkit-scrollbar-thumb:hover {
      background: rgba(129, 140, 248, 0.55);
    }

    /* Light switch: the dark-mode toggle as a physical wall plate, fixed
       top-right. It sits flush on the glass — no cast shadow, no press
       displacement; the rocker flip IS the feedback. Art follows icon law
       (paper plate, currentColor outline, tint slot/rocker). */
    .light-switch {
      position: fixed;
      z-index: 20;
      top: 32px;
      width: 48px;
      height: 64px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .sw-plate  { left: 0;    top: 0;    width: 48px; height: 64px; background: currentColor; }
    .sw-paper  { left: 8px;  top: 8px;  width: 32px; height: 48px; background: var(--identity-paper); }
    .sw-slot   { left: 16px; top: 16px; width: 16px; height: 32px; background: var(--identity-tint-soft); }
    .sw-rocker { left: 16px; top: 16px; width: 16px; height: 16px; background: var(--identity-tint-mid); }

    /* Rocker down = lights off. */
    html[data-theme="dark"] .sw-rocker { top: 32px; }

    /* ------------------------------------------------------------------ *
     * Phone mode — System 8 as a phone would have shipped it.
     *
     * Overlapping, draggable windows are a big-screen idea: at 375px two of
     * them simply cover each other (the 32px cascade step is meaningless when
     * both are already as wide as the display). So below 640px the desk stops
     * pretending to be a desk. The icons ARE the home screen — alignToGrid
     * already flows them into centred rows, so they need no help — and an app
     * fills the display instead of floating above one.
     *
     * The pixel laws are untouched: the 8px grid, the chunky chrome and Enter
     * Command at 16px all hold at this width. Only the furniture moves.
     *
     * This block must stay LAST: a media query carries no extra weight, so it
     * beats the base rules on source order alone. VisualIdentity.isPhone()
     * mirrors the 640px so the JS side can't drift from it.
     * ------------------------------------------------------------------ */
    @media (max-width: 640px) {
      /* The app IS the screen. No drop shadow — it would fall off the display,
         and nothing floats above anything here to cast one. placeWindow clears
         the desk's inline coords in this mode, so left/top land unopposed. */
      .mac-window {
        left: 0;
        top: 0;
        width: 100vw;
        height: 100dvh;
        border-width: 0;
        box-shadow: none;
      }

      /* The title bar (48px + its 4px rule) is the app bar; the content takes
         whatever is left. dvh, not vh, so the browser's own chrome sliding in
         and out doesn't crop the last row. */
      .mac-content {
        max-height: calc(100dvh - 52px);
        height: calc(100dvh - 52px);
        padding: 16px;
      }

      /* Nothing to drag a full-screen app to. */
      .mac-titlebar { cursor: default; }
      .mac-window.dragging .mac-titlebar { cursor: default; }
    }

  </style>
</head>
